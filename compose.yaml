services:
  api:
    image: composer:2
    working_dir: /app
    user: "1000:1000"
    environment:
      COMPOSER_HOME: /tmp/composer
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    command: sh scripts/start-api.sh
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    command: sh -c "npm ci --no-fund && npm run dev"
volumes:
  node_modules:
